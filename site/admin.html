<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Back office | RAPMAG</title><meta name="theme-color" content="#0a0a0b"><link rel="stylesheet" href="style.css?v=31">
<style>
body{font-size:14px}.adm{padding:30px 0 80px}
.ah{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:24px}.ah h1{font:400 40px/1 Anton,sans-serif;margin-right:auto}
.b{background:none;border:1px solid #c9c6bf;color:var(--ink);font:800 11px Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;padding:12px 16px;transition:.15s}.b:hover{border-color:var(--ink)}
.b.r{background:var(--red);border-color:var(--red);color:#fff}.b.r:hover{background:var(--ink);border-color:var(--ink)}.b.d{border-color:#f0c4c6;color:#c81d27}.b.d:hover{background:var(--red);color:#fff}
.pn{background:var(--bg2);border:1px solid var(--line);padding:20px}
label{display:block;font:800 10px Inter,sans-serif;letter-spacing:.18em;color:var(--mut);margin:14px 0 6px;text-transform:uppercase}
input[type=text],input[type=password],select,textarea{width:100%;background:#fff;border:1px solid #d5d2cb;color:var(--ink);font:500 14px Inter,sans-serif;padding:12px;outline:0}input:focus,select:focus,textarea:focus{border-color:var(--red)}
.login{max-width:420px;margin:12vh auto}.login h1{font:400 54px/1 Anton,sans-serif;margin-bottom:6px}
.lst{display:grid;gap:8px}.row{display:grid;grid-template-columns:84px 1fr auto;gap:16px;align-items:center;padding:10px;border:1px solid var(--line);background:#fff;cursor:pointer;transition:.15s}.row:hover{border-color:var(--ink)}
.row .t{width:84px;height:56px;background:#e9e7e2;overflow:hidden}.row .t img{width:100%;height:100%;object-fit:cover}
.row b{font:400 20px/1.1 Anton,sans-serif;text-transform:uppercase;display:block}.row small{color:var(--mut);font:600 11px Inter,sans-serif;letter-spacing:.06em}
.pill{font:800 10px Inter,sans-serif;letter-spacing:.14em;padding:5px 8px;text-transform:uppercase}.pill.published{background:#dff3e6;color:#137a3a}.pill.draft{background:#fbf0d4;color:#8a6200}
.ed{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.ttl{width:100%;resize:none;overflow:hidden;background:none;border:0;border-bottom:1px solid var(--line);color:var(--ink);font:400 clamp(34px,4vw,56px)/1 Anton,sans-serif;text-transform:uppercase;padding:6px 0 14px;outline:0}
.dk{width:100%;background:none;border:0;color:#3c3c42;font:400 20px/1.5 'Source Serif 4',Georgia,serif;padding:12px 0;outline:0;resize:none}
.tb{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:4px;background:#fff;border:1px solid var(--line);padding:6px;margin-top:10px}
.tb button{background:none;border:1px solid transparent;color:#222;font:800 12px Inter,sans-serif;min-width:38px;height:36px;padding:0 10px}.tb button:hover{border-color:#c9c6bf;background:#f1efea}.tb .sp{width:1px;background:var(--line);margin:4px 4px}
.body.edit{min-height:60vh;outline:0;padding:24px 4px 80px;border:1px solid transparent}.body.edit:focus{border-color:var(--line)}.body.edit:empty:before{content:'Write your story… paste or drop images straight in.';color:#999}
.body.edit figure{position:relative}.body.edit figcaption:empty:before{content:'Caption (optional)';color:#999}
.body.edit p:first-of-type:first-letter{float:none;font:inherit;color:inherit;margin:0}
.cov{aspect-ratio:16/9;background:#f1efea;border:1px dashed #c9c6bf;display:grid;place-items:center;overflow:hidden;cursor:pointer;color:var(--mut);font:700 11px Inter,sans-serif;letter-spacing:.14em;position:relative}.cov img{width:100%;height:100%;object-fit:cover}
.chk{display:flex;gap:8px;align-items:center;font:600 13px Inter,sans-serif;color:#222;margin-top:14px;cursor:pointer}.chk input{accent-color:var(--red);width:16px;height:16px}
.st{font:600 12px Inter,sans-serif;color:var(--mut);margin-top:12px;min-height:18px}
.modal{position:fixed;inset:0;background:rgba(20,20,22,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px}.modal .pn{width:min(1100px,96vw);max-height:90vh;overflow:auto}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:14px}.lib div{position:relative;aspect-ratio:1;background:#e9e7e2;cursor:pointer;border:2px solid transparent;overflow:hidden}.lib div:hover{border-color:var(--red)}.lib img{width:100%;height:100%;object-fit:cover}.lib button{position:absolute;top:4px;right:4px;background:#fffd;border:0;color:#c81d27;font:800 10px Inter;padding:4px 6px}
.drop{outline:3px dashed var(--red);outline-offset:-3px}
.up{position:fixed;right:20px;bottom:20px;background:#fff;color:var(--ink);border:1px solid var(--red);padding:12px 16px;font:700 12px Inter,sans-serif;z-index:120;display:none}
@media(max-width:1000px){.ed{grid-template-columns:1fr}}
.topnav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:22px;padding-bottom:16px;border-bottom:1px solid var(--line)}.b.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.ed aside{display:flex;flex-direction:column;gap:14px}.hint{font:500 12px/1.5 Inter,sans-serif;color:var(--mut);margin-top:6px}
.pill.scheduled{background:#e3ecff;color:#1d4fc4}
.seoh{display:flex;justify-content:space-between;align-items:center;font:800 11px Inter,sans-serif;letter-spacing:.16em}#sco{font:400 26px Anton,sans-serif;letter-spacing:0}#sco.good{color:#137a3a}#sco.mid{color:#8a6200}#sco.low{color:var(--red)}
.ck{display:grid;grid-template-columns:22px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}.ck i{font-style:normal;font:800 12px Inter;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:#fde8ea;color:var(--red)}.ck.ok i{background:#dff3e6;color:#137a3a}.ck b{display:block;font:700 13px Inter,sans-serif}.ck small{color:var(--mut);font:500 11px Inter,sans-serif}
input[type=datetime-local]{width:100%;background:#fff;border:1px solid #d5d2cb;color:var(--ink);font:500 14px Inter,sans-serif;padding:11px}
.row input[type=text]{padding:8px 10px}
.tool{background:#fff;border:1px solid var(--line);padding:14px 16px;margin-top:12px}.toolh{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.toolh .b{font:700 14px Inter,sans-serif;letter-spacing:0;text-transform:none;padding:12px 16px}.toolh span{font:500 12px Inter,sans-serif;color:var(--mut)}
.tool h4{font:800 11px Inter,sans-serif;letter-spacing:.16em;color:var(--mut);margin:16px 0 8px;text-transform:uppercase}
.hit{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 4px;cursor:pointer;color:var(--ink)}.hit:hover{background:#f7f6f3}.hit b{display:block;font:700 15px Inter,sans-serif;color:#1a0dab}.hit small{display:block;font:600 12px Inter,sans-serif;color:#137a3a;margin:2px 0 4px}.hit span{display:block;font:400 13px/1.5 Inter,sans-serif;color:#4a4a50;max-height:4.5em;overflow:hidden}
.sug{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}.sug button{background:#f1efea;border:1px solid #d5d2cb;font:600 11px Inter,sans-serif;padding:5px 8px;cursor:pointer}.sug button:hover{border-color:var(--ink)}
.rp-add{display:flex;gap:8px;margin:14px 0 4px}.rp-add input{flex:1}
.rp-h{font:400 26px Anton,sans-serif;margin:26px 0 8px;letter-spacing:.01em}.rp-h small{font:600 11px Inter,sans-serif;color:var(--mut);letter-spacing:.06em;margin-left:8px;text-transform:uppercase}
.rp-row{display:grid;grid-template-columns:36px 52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 0;border-top:1px solid #e3e0d9}.rp-row.off{opacity:.45}
.rp-n{font:400 26px Anton,sans-serif;text-align:center}.rp-row img,.rp-ni{width:52px;height:52px;object-fit:cover;background:#111;display:block}
.rp-t strong{display:block;font:700 14px Inter,sans-serif}.rp-t small{font:600 11px Inter,sans-serif;color:var(--mut)}
.rp-b{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}.rp-b .b{padding:8px 10px}
.ic-row .rp-t input{display:block;width:100%;margin:0 0 4px;padding:6px 8px}.ic-l{display:flex;flex-direction:column;font:700 9px Inter,sans-serif;letter-spacing:.08em;color:var(--mut)}.ic-l input{width:90px;padding:6px}.ic-row select{padding:6px}.ic-row img{cursor:pointer}.ic-row{grid-template-columns:36px 52px minmax(0,1fr) auto}
.ic-bo{position:relative;display:flex;align-items:center;gap:8px;margin-top:6px;background:#f1eee7;height:26px;overflow:hidden}.ic-bo span{position:absolute;left:0;top:0;bottom:0;background:#f5c518}.ic-bo em{position:relative;font:700 10px Inter,sans-serif;letter-spacing:.06em;font-style:normal;padding-left:8px;flex:1}.ic-bo .b{position:relative;padding:4px 8px;font-size:10px}
.ic-dur{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}.ic-cus{display:flex;gap:8px;align-items:center;margin-top:10px;font:600 12px Inter,sans-serif}.ic-cus input{width:80px}
.ic-help{background:#111;color:#eee;padding:14px 16px;margin:0 0 12px;font:500 13px/1.45 Inter,sans-serif}.ic-help>b{display:block;font:800 11px Inter,sans-serif;letter-spacing:.2em;color:#f5c518;margin-bottom:6px}.ic-help p{margin:4px 0;display:flex;gap:10px}.ic-help p span{flex:none;width:20px;height:20px;border-radius:50%;background:#f5c518;color:#000;font:900 11px/20px Inter,sans-serif;text-align:center}
.ic-dirty{background:#fff3cd;border-left:4px solid #f5c518;padding:10px 12px;font:700 13px Inter,sans-serif;margin-bottom:10px}
.ic-card{border:1px solid #e3e0d9;background:#fff;padding:12px;margin:10px 0}.ic-card.off{opacity:.55}
.ic-top{display:grid;grid-template-columns:40px 56px minmax(0,1fr) auto;gap:12px;align-items:center}.ic-top img{width:56px;height:56px;object-fit:cover;cursor:pointer}.ic-top .ic-disc{border-radius:50%;object-fit:contain}
.ic-name input{display:block;width:100%;margin:0 0 4px;padding:6px 8px}.ic-tot{text-align:right}.ic-tot strong{display:block;font:400 30px/1 Anton,sans-serif}.ic-tot small{font:700 9px Inter,sans-serif;letter-spacing:.14em;color:var(--mut)}
.ic-parts{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}.ic-parts span{background:#f1eee7;padding:4px 8px;font:600 11px Inter,sans-serif}.ic-parts b{margin-left:4px}
.ic-act{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}.ic-act .b{padding:8px 10px}.ic-act .b[disabled]{opacity:.35;cursor:default}.ic-gap{flex:1}
.ic-spot{display:flex;align-items:center;gap:6px;font:800 10px Inter,sans-serif;letter-spacing:.1em}.ic-spot select{padding:7px}
.ic-ck{display:flex;gap:8px;align-items:center;font:600 13px Inter,sans-serif;margin:8px 0}
.ic-lk{margin-top:6px}.ic-lt{background:#fff1f1!important;font-weight:800!important}.ic-lt img{width:13px;height:13px;vertical-align:-2px}
.ic-tg{border:1px solid #e3e0d9;background:#fff;font:800 10px Inter,sans-serif;letter-spacing:.06em;padding:4px 8px;cursor:pointer}.ic-tg.on{background:#111;color:#fff;border-color:#111}
.ic-bo.lk span{background:#ff9aa0}
.alb{border:1px solid #e3e0d9;background:#fff;padding:10px}.alb-top{display:flex;align-items:center;gap:8px}.alb-top img{width:22px;height:22px}.alb-top strong{font:400 26px/1 Anton,sans-serif}.alb-top small{font:700 9px Inter,sans-serif;letter-spacing:.12em;color:var(--mut)}
.alb-p{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}.alb-p span{background:#f1eee7;padding:3px 7px;font:600 11px Inter,sans-serif}.alb-a{display:flex;flex-wrap:wrap;gap:5px}.alb-a .b{padding:7px 9px;font-size:10px}.alb-a .b[disabled]{opacity:.35}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#111;color:#fff;font:700 13px Inter,sans-serif;padding:12px 18px;z-index:300;opacity:0;pointer-events:none;transition:.25s;max-width:90vw}#toast.on{opacity:1;transform:translate(-50%,0)}
</style></head>
