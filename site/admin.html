<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Back office | RAPMAG</title><meta name="theme-color" content="#0a0a0b"><link rel="stylesheet" href="style.css?v=8">
<style>
body{font-size:14px}.adm{padding:30px 0 80px}
.ah{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:24px}.ah h1{font:400 40px/1 Anton,sans-serif;margin-right:auto}
.b{background:none;border:1px solid #c9c6bf;color:var(--ink);font:800 11px Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;padding:12px 16px;transition:.15s}.b:hover{border-color:var(--ink)}
.b.r{background:var(--red);border-color:var(--red);color:#fff}.b.r:hover{background:var(--ink);border-color:var(--ink)}.b.d{border-color:#f0c4c6;color:#c81d27}.b.d:hover{background:var(--red);color:#fff}
.pn{background:var(--bg2);border:1px solid var(--line);padding:20px}
label{display:block;font:800 10px Inter,sans-serif;letter-spacing:.18em;color:var(--mut);margin:14px 0 6px;text-transform:uppercase}
input[type=text],input[type=password],select,textarea{width:100%;background:#fff;border:1px solid #d5d2cb;color:var(--ink);font:500 14px Inter,sans-serif;padding:12px;outline:0}input:focus,select:focus,textarea:focus{border-color:var(--red)}
.login{max-width:420px;margin:12vh auto}.login h1{font:400 54px/1 Anton,sans-serif;margin-bottom:6px}
.lst{display:grid;gap:8px}.row{display:grid;grid-template-columns:84px 1fr auto;gap:16px;align-items:center;padding:10px;border:1px solid var(--line);background:#fff;cursor:pointer;transition:.15s}.row:hover{border-color:var(--ink)}
.row .t{width:84px;height:56px;background:#e9e7e2;overflow:hidden}.row .t img{width:100%;height:100%;object-fit:cover}
.row b{font:400 20px/1.1 Anton,sans-serif;text-transform:uppercase;display:block}.row small{color:var(--mut);font:600 11px Inter,sans-serif;letter-spacing:.06em}
.pill{font:800 10px Inter,sans-serif;letter-spacing:.14em;padding:5px 8px;text-transform:uppercase}.pill.published{background:#dff3e6;color:#137a3a}.pill.draft{background:#fbf0d4;color:#8a6200}
.ed{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.ttl{width:100%;resize:none;overflow:hidden;background:none;border:0;border-bottom:1px solid var(--line);color:var(--ink);font:400 clamp(34px,4vw,56px)/1 Anton,sans-serif;text-transform:uppercase;padding:6px 0 14px;outline:0}
.dk{width:100%;background:none;border:0;color:#3c3c42;font:400 20px/1.5 'Source Serif 4',Georgia,serif;padding:12px 0;outline:0;resize:none}
.tb{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:4px;background:#fff;border:1px solid var(--line);padding:6px;margin-top:10px}
.tb button{background:none;border:1px solid transparent;color:#222;font:800 12px Inter,sans-serif;min-width:38px;height:36px;padding:0 10px}.tb button:hover{border-color:#c9c6bf;background:#f1efea}.tb .sp{width:1px;background:var(--line);margin:4px 4px}
.body.edit{min-height:60vh;outline:0;padding:24px 4px 80px;border:1px solid transparent}.body.edit:focus{border-color:var(--line)}.body.edit:empty:before{content:'Write your story… paste or drop images straight in.';color:#999}
.body.edit figure{position:relative}.body.edit figcaption:empty:before{content:'Caption (optional)';color:#999}
.body.edit p:first-of-type:first-letter{float:none;font:inherit;color:inherit;margin:0}
.cov{aspect-ratio:16/9;background:#f1efea;border:1px dashed #c9c6bf;display:grid;place-items:center;overflow:hidden;cursor:pointer;color:var(--mut);font:700 11px Inter,sans-serif;letter-spacing:.14em;position:relative}.cov img{width:100%;height:100%;object-fit:cover}
.chk{display:flex;gap:8px;align-items:center;font:600 13px Inter,sans-serif;color:#222;margin-top:14px;cursor:pointer}.chk input{accent-color:var(--red);width:16px;height:16px}
.st{font:600 12px Inter,sans-serif;color:var(--mut);margin-top:12px;min-height:18px}
.modal{position:fixed;inset:0;background:rgba(20,20,22,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px}.modal .pn{width:min(1100px,96vw);max-height:90vh;overflow:auto}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:14px}.lib div{position:relative;aspect-ratio:1;background:#e9e7e2;cursor:pointer;border:2px solid transparent;overflow:hidden}.lib div:hover{border-color:var(--red)}.lib img{width:100%;height:100%;object-fit:cover}.lib button{position:absolute;top:4px;right:4px;background:#fffd;border:0;color:#c81d27;font:800 10px Inter;padding:4px 6px}
.drop{outline:3px dashed var(--red);outline-offset:-3px}
.up{position:fixed;right:20px;bottom:20px;background:#fff;color:var(--ink);border:1px solid var(--red);padding:12px 16px;font:700 12px Inter,sans-serif;z-index:120;display:none}
@media(max-width:1000px){.ed{grid-template-columns:1fr}}
</style></head>
<body><div class="wrap adm" id="app"></div><div class="up" id="up"></div><script src="config.js?v=1"></script><script src="admin.js?v=2"></script></body></html>
