name = "rapmag-api"
main = "src/index.js"
compatibility_date = "2025-09-01"

[vars]
# sites allowed to call the API (GitHub Pages address + local preview)
ALLOWED_ORIGINS = "http://localhost:8780,http://127.0.0.1:8780,https://mezdefjam2014.github.io"

[[d1_databases]]
binding = "DB"
database_name = "rapmag-db"
database_id = "local-dev"   # replaced with the real id after `wrangler d1 create rapmag-db`

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "rapmag-images"

# secrets (set with `wrangler secret put`, never committed): ADMIN_PASSWORD, SESSION_SECRET
